services:
  postgres:
    image: postgres:16-alpine
    container_name: livingdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livingdocs}
      POSTGRES_USER: ${POSTGRES_USER:-livingdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livingdocs} -d ${POSTGRES_DB:-livingdocs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - livingdocs-net

  # Redis is used as a distributed L2 cache for AI responses, knowledge-base
  # search results, user permissions, and code-entity lookups. The Spring
  # backend connects to it on startup; if Redis is down, the app degrades
  # gracefully and falls back to direct DB calls.
  redis:
    image: redis:7-alpine
    container_name: livingdocs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - livingdocs-net

  # Apache Kafka + ZooKeeper form the event bus for background work
  # (documentation generation, drift detection, notifications). ZooKeeper
  # is the default KRaft-less controller in this dev compose file; a
  # production deployment would switch to the KRaft-only image.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: livingdocs-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - livingdocs-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: livingdocs-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - livingdocs-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livingdocs-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: ${BACKEND_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-livingdocs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-livingdocs}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATABASEPLATFORM_DEFAULT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-please-this-is-a-development-only-secret-32b+}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-1440}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      # ---- Redis cache ----
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CACHE_TYPE: redis
      APP_CACHE_TTL_SECONDS: ${APP_CACHE_TTL_SECONDS:-300}
      # ---- Kafka event bus ----
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: livingdocs-backend
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      SPRING_KAFKA_PRODUCER_ACKS: all
      APP_KAFKA_TOPIC_DOC_GENERATION_REQUESTED: doc.generation.requested
      APP_KAFKA_TOPIC_DOC_GENERATION_COMPLETED: doc.generation.completed
      APP_KAFKA_TOPIC_DRIFT_DETECTION_COMPLETED: drift.detection.completed
      APP_KAFKA_TOPIC_NOTIFICATION_SEND: notification.send
      # ---- OAuth (Google — login) ----
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oauth/google/callback}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-openid,email,profile}
      GOOGLE_OAUTH_SANDBOX: ${GOOGLE_OAUTH_SANDBOX:-true}
      # ---- OAuth (GitHub — login) ----
      GITHUB_OAUTH_LOGIN_CLIENT_ID: ${GITHUB_OAUTH_LOGIN_CLIENT_ID:-}
      GITHUB_OAUTH_LOGIN_CLIENT_SECRET: ${GITHUB_OAUTH_LOGIN_CLIENT_SECRET:-}
      GITHUB_OAUTH_LOGIN_REDIRECT_URI: ${GITHUB_OAUTH_LOGIN_REDIRECT_URI:-http://localhost:8080/api/v1/auth/oauth/github/callback}
      GITHUB_OAUTH_LOGIN_SCOPES: ${GITHUB_OAUTH_LOGIN_SCOPES:-read:user,user:email}
      GITHUB_OAUTH_SANDBOX: ${GITHUB_OAUTH_SANDBOX:-true}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-dev_github_client_id}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-dev_github_client_secret}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:8080/api/v1/github/oauth/callback}
      GITHUB_OAUTH_SCOPES: ${GITHUB_OAUTH_SCOPES:-repo,read:user,read:org}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_API_TIMEOUT_MS: ${GITHUB_API_TIMEOUT_MS:-15000}
      GITHUB_API_USER_AGENT: ${GITHUB_API_USER_AGENT:-livingdocs-backend}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev_webhook_secret}
      GITHUB_SANDBOX: ${GITHUB_SANDBOX:-true}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      AI_SERVICE_API_PREFIX: ${AI_SERVICE_API_PREFIX:-/api/v1}
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
      AI_SERVICE_CONFIDENCE_THRESHOLD: ${AI_SERVICE_CONFIDENCE_THRESHOLD:-0.65}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - livingdocs-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: livingdocs-ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    networks:
      - livingdocs-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: livingdocs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - livingdocs-net

networks:
  livingdocs-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data: