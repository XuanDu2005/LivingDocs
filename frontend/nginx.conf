server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow Vite/Rollup hashed assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — let React Router handle client-side routes.
    #
    # index.html must never be cached: it is the file that points at the
    # hashed asset bundles. A cached copy keeps pointing at the previous
    # bundle after a deploy, so the browser runs old code against a new
    # API — which shows up as mysterious blank pages and stale crashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}